<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4338ca">
    <title>You're offline</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light dark; --bg: #f4f3fb; --card: #ffffff; --text: #17152e; --muted: #69668a; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0b0c1d; --card: #12132b; --text: #eceaff; --muted: #a3a0c8; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; font: 16px/1.5 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); background: var(--bg); }
        main { width: min(100%, 24rem); padding: 2rem 1.5rem; border-radius: 22px; text-align: center; background: var(--card); box-shadow: 0 20px 45px -25px rgba(23, 21, 46, 0.35); }
        img { width: 4.5rem; height: 4.5rem; }
        h1 { margin: 1rem 0 0.35rem; font-size: 1.35rem; }
        p { margin: 0 0 1.5rem; color: var(--muted); }
        button { padding: 0.7rem 1.4rem; border: 0; border-radius: 999px; font: 600 0.95rem/1 inherit; color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed); cursor: pointer; }
        button:focus-visible { outline: 3px solid rgba(79, 70, 229, 0.4); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/favicon.svg" alt="">
        <h1>You're offline</h1>
        <p>Check your internet connection. Your chats will be here when you're back online.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
